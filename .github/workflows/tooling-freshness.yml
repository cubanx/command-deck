name: Tooling Freshness

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  tooling-freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
      - run: bun run knowledge:check
